server.port=8080

# The database comes from PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD. sslmode is off for the
# Compose Postgres here; the Dockerfile sets PGSSLMODE=require for the container.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cfp}?sslmode=${PGSSLMODE:disable}
spring.datasource.username=${PGUSER:cfp}
spring.datasource.password=${PGPASSWORD:cfp}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info

# Kept from the 2019 setup, the mobile client depends on some of these (Boot 4 names; Boot 2 had server.error.*,
# server.servlet.encoding.* and spring.jackson.parser.*)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.servlet.encoding.force=true
spring.jackson.json.read.allow-java-comments=true

# Jackson 3 defaults that would change our JSON: keep fields in declaration order (Jackson 3 sorts them), and write
# dates such as the error "timestamp" with +00:00 as Jackson 2 did (Jackson 3 writes Z).
spring.jackson.mapper.sort-properties-alphabetically=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'+00:00'
spring.jackson.time-zone=UTC

#logging.level.org.springframework.jdbc.core=DEBUG

# Boot 4 adds the liveness and readiness groups to /actuator/health; Boot 2.7 didn't show them.
management.endpoint.health.probes.enabled=false
