# Deploys main to your team URL (deploy contract: README.md).
#
# The job builds the root Dockerfile with this commit's SHA baked in, pushes it to your registry as
# app:<sha> and app:latest, and runs .github/fagdag/rollout.sh. That redeploys your container, fails
# unless Scaleway reports it ready, then waits up to 60 s for GET /health to answer 200 with this
# commit's SHA as its version. If any of that fails, it points app:latest back at the version that
# was live before (which keeps serving) and the job fails, with the container's error_message and
# its logs since the job started in the last step.
#
# team-5: the image is built once (job `image`, cached layers, pushed as app:<sha> only) in parallel with `tests`
# (./mvnw verify on Java 25); `smoke` runs that image against a fresh Postgres and examples/*.hurl. The deploy job waits
# for both gates, points app:latest at the tested image and rolls out. A red gate means no deploy; the live version
# keeps serving.
#
# You own this file. Add your own gates (tests, Hurl examples, review checks) as jobs that the
# deploy job `needs`; they run on GitHub-hosted runners. If you break it, you lose your own ticks.
#
# The organisers set the config: the secrets SCW_ACCESS_KEY and SCW_SECRET_KEY (your push key) and
# the variables SCW_REGISTRY, SCW_CONTAINER_ID, SCW_ORGANIZATION_ID and TEAM_URL. Don't change them.
name: deploy

on:
  push:
    branches: [main]
    # team-5: a push that only touches these doesn't deploy (every deploy costs points while the new instance is
    # cold). A push with any other file deploys as usual.
    paths-ignore:
      - "**.md"
      - "workflow/**"
      - ".claude/**"
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate 1 (team-5): the whole test suite, on the production Java. Testcontainers uses the runner's Docker.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-
      - name: Tests
        run: ./mvnw -B verify

  # team-5: the image is built once, with Docker's layer cache, as soon as the push arrives (in parallel with the
  # tests), and pushed as app:<sha> only. That changes nothing live: the platform runs app:latest, which only the
  # deploy job moves. smoke tests this exact image, and deploy rolls out the same bytes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_REGISTRY: ${{ vars.SCW_REGISTRY }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the registry
        run: echo "$SCW_SECRET_KEY" | docker login "${SCW_REGISTRY%%/*}" --username nologin --password-stdin
      - name: Build and push app:<sha> (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ vars.SCW_REGISTRY }}/app:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A plain image manifest, as `docker build` pushed before: no attestation index for the platform to pull.
          provenance: false
          sbom: false

  # Gate 2 (team-5): the exact image we'll deploy, started next to a Postgres, must pass /health and every
  # Hurl file in examples/ (the published examples plus our own for the drip features).
  smoke:
    needs: image
    runs-on: ubuntu-24.04 # pinned: the Hurl .deb needs libxml2, which newer Ubuntu renamed
    timeout-minutes: 15
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_REGISTRY: ${{ vars.SCW_REGISTRY }}
      IMAGE: ${{ vars.SCW_REGISTRY }}/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Hurl
        run: |
          curl -fsSLO https://github.com/Orange-OpenSource/hurl/releases/download/8.1.0/hurl_8.1.0_amd64.deb
          sudo apt-get install -y ./hurl_8.1.0_amd64.deb
      - name: Pull the image
        run: |
          echo "$SCW_SECRET_KEY" | docker login "${SCW_REGISTRY%%/*}" --username nologin --password-stdin
          docker pull "$IMAGE"
      - name: Start Postgres and the image
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_DB=cfp -e POSTGRES_USER=cfp -e POSTGRES_PASSWORD=cfp postgres:16-alpine
          docker run -d --name app --network smoke -p 8080:8080 \
            -e PGHOST=db -e PGPORT=5432 -e PGDATABASE=cfp -e PGUSER=cfp -e PGPASSWORD=cfp -e PGSSLMODE=disable "$IMAGE"
          for i in $(seq 1 90); do
            if curl -fsS localhost:8080/health; then echo; break; fi
            sleep 1
          done
          curl -fsS localhost:8080/health | grep -q "\"version\":\"$GITHUB_SHA\"" || { docker logs app; exit 1; }
      - name: Hurl examples
        run: examples/run.sh http://localhost:8080
      - name: App logs
        if: ${{ always() }}
        run: docker logs app 2>&1 | tail -200

  deploy:
    needs: [tests, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # The scw CLI won't run without it, even with a key.
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_REGISTRY: ${{ vars.SCW_REGISTRY }}
      SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
      IMAGE: ${{ vars.SCW_REGISTRY }}/app
      SHA: ${{ github.sha }}
    steps:
      - name: Note the start time
        run: echo "ROLLOUT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_ENV"
      - uses: actions/checkout@v5
      - name: Install the Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          version: v2.65.2
      - name: Log in to the registry
        run: echo "$SCW_SECRET_KEY" | docker login "${SCW_REGISTRY%%/*}" --username nologin --password-stdin
      # team-5: no build here. The image job pushed app:<sha> and smoke tested it; point app:latest at it in the
      # registry (no pull, no push of layers).
      - name: Point app:latest at the tested app:<sha>
        run: |
          echo "Promoting $IMAGE:$SHA to $IMAGE:latest"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$SHA" || {
            echo "imagetools failed; pulling, tagging and pushing instead"
            docker pull "$IMAGE:$SHA" && docker tag "$IMAGE:$SHA" "$IMAGE:latest" && docker push "$IMAGE:latest"
          }
      - name: Roll out
        id: rollout
        env:
          ROLLOUT_URL: ${{ vars.TEAM_URL }}
          ROLLOUT_SHA: ${{ github.sha }}
          ROLLOUT_IMAGE: app
          ROLLOUT_POLL_SECONDS: "2" # team-5: see the new version on /health sooner (rollout.sh's default is 5)
        run: .github/fagdag/rollout.sh
      # Only when the rollout failed: build errors are in the step above it. Image pull errors only
      # show up in error_message; a crash on start-up shows up in the logs.
      - name: Logs
        if: ${{ failure() && steps.rollout.outcome == 'failure' }}
        run: |
          sleep 15 # Cockpit takes a few seconds to ingest the lines.
          echo "error_message: $(scw container container get "$SCW_CONTAINER_ID" -o json | jq -r '.error_message // "(none)"')" || true
          .github/fagdag/logs.sh --tail 200 --since "$ROLLOUT_STARTED_AT"
